# Every push and pull request: quick checks (recipes, scripts, documents,
# files that must not be committed) and WormOS's own programs built with
# GCC and Clang, warnings as errors, plus the unit tests. No image is built
# here: a full build takes hours (see release-tests.yml for the images).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: scripts/lint.sh

  build:
    name: Build (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang pkg-config \
            libcrypt-dev libgtk-4-dev libgtk4-layer-shell-dev libwayland-dev libwayland-bin
      - name: Build and run the unit tests
        run: scripts/ci-build.sh ${{ matrix.cc }}
