<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Snapshots: rings of a wormhole and an arrow going back in time. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#3b1d7a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fdf4ff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#e9d5ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.18"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <ellipse cx="64" cy="64" rx="34" ry="34" stroke-opacity="0.22" stroke-width="2"/>
    <ellipse cx="64" cy="64" rx="24" ry="24" stroke-opacity="0.38" stroke-width="2.5"/>
    <ellipse cx="64" cy="64" rx="14" ry="14" stroke-opacity="0.6" stroke-width="3"/>
  </g>
  <circle cx="64" cy="64" r="12" fill="url(#glow)"/>
  <!-- The arrow: three quarters of a circle, counter-clockwise. -->
  <g transform="matrix(-1 0 0 1 128 0)">
    <path d="M 92 64 A 28 28 0 1 1 64 36" fill="none" stroke="#ffffff"
          stroke-width="7" stroke-linecap="round"/>
    <path d="M 58 25 L 72 36 L 58 47 Z" fill="#ffffff" stroke="#ffffff"
          stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
