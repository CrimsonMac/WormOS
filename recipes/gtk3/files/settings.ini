# WormOS defaults for GTK 3 programs (Tor Browser): GTK's own Adwaita in
# its dark variant, with the icons, cursors and font of the desktop. Users
# can override them in ~/.config/gtk-3.0/settings.ini.
[Settings]
gtk-theme-name=Adwaita
gtk-application-prefer-dark-theme=true
gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-font-name=Inter Variable 10
gtk-decoration-layout=menu:minimize,maximize,close
