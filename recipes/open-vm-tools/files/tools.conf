# open-vm-tools settings for WormOS; see /etc/vmware-tools/tools.conf.example.

[resolutionKMS]
# Pass the size of the VMware window to the vmwgfx driver; the desktop then
# switches to it.
enable = true

[powerops]
# No scripts on power operations (none are installed).
poweroff-script =
poweron-script =
resume-script =
suspend-script =

[logging]
log = true
vmsvc.level = message
vmsvc.handler = file
vmsvc.data = /var/log/vmtoolsd.log
