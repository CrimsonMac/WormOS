# WormOS defaults for foot. Copy to ~/.config/foot/foot.ini to change.
font=Hack:size=11
pad=10x8
term=xterm-256color

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes

[colors-dark]
alpha=0.97
background=14111c
foreground=ece7f5
selection-background=4c2a85
selection-foreground=ffffff
regular0=1f1a2b
regular1=f0607a
regular2=7ee0a0
regular3=f5cf72
regular4=7aa2f7
regular5=b77cff
regular6=6fd6e0
regular7=cfc8dc
bright0=4a4160
bright1=ff8095
bright2=a0f0bc
bright3=ffe09a
bright4=a0bcff
bright5=d0a8ff
bright6=9ae8f0
bright7=ffffff
