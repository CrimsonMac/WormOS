# WormOS Amnesia defaults for foot: greys, with muted colours for programs.
font=Hack:size=11
pad=10x8
term=xterm-256color
# Login shells read /etc/profile, which greets each new terminal.
login-shell=yes

[text-bindings]
# Ctrl+Backspace deletes the previous word. foot sends ^H for it, which most
# programs take as a plain Backspace; ^W deletes a word in zsh, sh, readline
# programs, Python and vim alike.
\x17 = Control+BackSpace

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes

[colors-dark]
alpha=0.97
background=111111
foreground=e8e8e8
selection-background=4d4d4d
selection-foreground=ffffff
regular0=1c1c1c
regular1=c98a8a
regular2=a3bfa3
regular3=c9bf9a
regular4=9aa8c2
regular5=b3a3c2
regular6=9abfbf
regular7=cccccc
bright0=4a4a4a
bright1=dba3a3
bright2=bcd4bc
bright3=dbd2b3
bright4=b3bfd4
bright5=c8bcd4
bright6=b3d4d4
bright7=ffffff
