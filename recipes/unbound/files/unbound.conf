# WormOS DNS: a local caching resolver. Programs reach it through
# /etc/resolv.conf (127.0.0.1). It sends queries encrypted (DNS over TLS)
# to the resolvers in forward-zone below and checks DNSSEC signatures
# itself. DNS servers announced by DHCP are not used (they are recorded in
# /run/worm/dhcp-dns). Add settings in /etc/unbound/unbound.conf.d/*.conf.

server:
	interface: 127.0.0.1
	interface: ::1
	username: "unbound"
	chroot: ""
	directory: "/var/lib/unbound"
	pidfile: ""
	use-syslog: yes
	verbosity: 0

	# Say as little as possible about us and our queries.
	hide-identity: yes
	hide-version: yes
	qname-minimisation: yes
	minimal-responses: yes

	# Validate, and refuse answers that look forged.
	auto-trust-anchor-file: "/var/lib/unbound/root.key"
	harden-glue: yes
	harden-dnssec-stripped: yes
	harden-below-nxdomain: yes
	aggressive-nsec: yes

	prefetch: yes
	tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"

include: "/etc/unbound/unbound.conf.d/*.conf"

# Quad9: a non-profit resolver that keeps no logs of IP addresses and
# blocks known malware domains. Certificates are checked against the names
# after '#'.
forward-zone:
	name: "."
	forward-tls-upstream: yes
	forward-addr: 9.9.9.9@853#dns.quad9.net
	forward-addr: 149.112.112.112@853#dns.quad9.net
	forward-addr: 2620:fe::fe@853#dns.quad9.net
	forward-addr: 2620:fe::9@853#dns.quad9.net
